name: Build YT Go Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Fyne deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build APK (Native, No WebView)
        run: |
          export PATH=$PATH:~/go/bin
          fyne package -os android -appID com.yt.gonative -name "YT Go Native" -icon icon.png --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Go-Native-APK
          path: "*.apk"

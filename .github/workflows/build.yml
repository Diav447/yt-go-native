name: Build YT Go Native APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build APK with Fyne-Cross (SDK udah di dalem)
        run: |
          go install github.com/fyne-io/fyne-cross@latest
          export PATH=$PATH:~/go/bin
          fyne-cross android --app-id com.yt.gonative --name "YT Go Native" --icon icon.png
          mv fyne-cross/dist/android/*.apk ./YT-Go-Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Go-Native-APK
          path: "*.apk"
